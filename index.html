<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathfinding Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Pathfinding Visualizer</h1>

    <div id="controls">
      <select id="algo">
        <option value="astar">A*</option>
        <option value="dijkstra">Dijkstra</option>
        <option value="greedy">Greedy Best-First</option>
        <option value="bfs">BFS</option>
        <option value="dfs">DFS</option>
      </select>

      <select id="heuristic">
        <option value="manhattan">Manhattan</option>
        <option value="euclidean">Euclidean</option>
        <option value="chebyshev">Diagonal</option>
      </select>

      <label
        >Speed
        <input type="range" id="speed" min="1" max="100" value="50" />
      </label>

      <button id="run">Visualize</button>
      <button id="clearPath">Clear Path</button>
      <button id="clearAll">Clear Board</button>
      <button id="maze">Random Maze</button>
      <button id="compare">Compare All</button>
      <button id="clearStats">Clear Stats</button>
    </div>

    <div id="grid"></div>

    <h2>Run History</h2>
    <table id="stats">
      <thead>
        <tr>
          <th>Algorithm</th>
          <th>Nodes Explored</th>
          <th>Path Length</th>
          <th>Path Cost</th>
          <th>Time (ms)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Algorithm Comparison</h2>
    <table id="compareTable">
      <thead>
        <tr>
          <th>Algorithm</th>
          <th>Nodes Explored</th>
          <th>Path Length</th>
          <th>Path Cost</th>
          <th>Time (ms)</th>
          <th>Optimal?</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="js/priorityQueue.js"></script>
    <script src="js/heuristics.js"></script>
    <script src="js/algorithms.js"></script>
    <script src="js/maze.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
